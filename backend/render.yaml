services:
  - type: web
    name: fiveminpush-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a secure secret
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DB_PATH
        value: ./data/app.db
      - key: ALLOWED_ORIGINS
        value: https://fiveminutepush.com,https://www.fiveminutepush.com
